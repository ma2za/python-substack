name: Feature request
description: Suggest an API, Markdown, CLI, or MCP improvement.
title: "Feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you trying to do?
      placeholder: I want to publish...
    validations:
      required: true
  - type: textarea
    id: proposed-api
    attributes:
      label: Proposed API or CLI
      description: Show the Python or shell interface you would like.
      render: python
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What are you using now?
    validations:
      required: false
